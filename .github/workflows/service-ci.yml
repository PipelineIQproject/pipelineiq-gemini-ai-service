name: Service CI/CD

on:
  push:
    branches:
      - dev
      - master
  workflow_dispatch:

jobs:
  service:
    uses: PipelineIQproject/pipeline_main/.github/workflows/reusable-node-service-ci.yml@dev
    with:
      service_name: gemini-ai-service
      image_name: final_capstone-gemini-ai-service
      dockerfile: services/gemini-ai-service/Dockerfile
      node_project_dir: services/gemini-ai-service
      chart_path: gemini-ai-service
      container_port: "8080"
      smoke_mode: container
      sonar_organization: pipelineiqproject
      sonar_project_key: pipelineiq-gemini-ai-service
    secrets: inherit
